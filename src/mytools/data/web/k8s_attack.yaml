  - ["/dashboard/", "Dashboard root"]
  - ["/dashboard/#/login", "Dashboard login"]
  - ["/api/v1/ namespaces/kubernetes-dashboard/endpoints", "Dashboard endpoints"]
  - ["/apis/dashboard.k8s.io/v1alpha1/namespaces/kubernetes-dashboard/dashboards", "Dashboard CRD"]

auth_headers:
