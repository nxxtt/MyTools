    - proto_admin
    - proto_role
    - proto_settings
    - proto_version
  constructor:
    - ctor_basic
    - ctor_admin
    - ctor_role
    - ctor_proto
    - ctor_inject
  bypass:
    - url_encode
    - double_encode
    - nested
    - array_bracket
    - dot_notation
  blind:
    - blind_timing
    - blind_reflection
    - blind_stored
    - blind_header
    - blind_cookie
  impact:
    - impact_isadmin
    - impact_role
    - impact_settings
    - impact_rce
