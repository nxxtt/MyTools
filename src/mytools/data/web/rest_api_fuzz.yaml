# REST API Fuzzer Payloads
# Usado por restapifuzz.py
# Chaves top-level FLAT: devem bater com os argumentos de _get_str_list/_get_tuple_list do modulo.

# Auto-detect endpoints via OpenAPI spec
openapi_probe_paths:
  - /openapi.json
  - /openapi.yaml
  - /swagger.json
  - /swagger.yaml
  - /api-docs
  - /api/docs
  - /docs
  - /v1/openapi.json
  - /v2/openapi.json
  - /api/openapi.json

# Tokens usados em Authorization: Bearer <token> para bypass de autenticacao
auth_bearer_tokens:
  - ""
  - "null"
  - "undefined"
  - "false"
  - "0"
  - "admin"
  - "test"
  - "token"
  - "Bearer "
  - "Bearer null"
  - "Bearer undefined"

# Cabecalhos alternativos para bypass de autenticacao (par nome/valor)
auth_headers:
  - ["X-Auth-Token", ""]
  - ["X-Auth-Token", "null"]
  - ["X-Api-Key", ""]
  - ["X-Api-Key", "null"]
  - ["X-Forwarded-For", "127.0.0.1"]
  - ["X-Forwarded-For", "::1"]
  - ["X-Real-IP", "127.0.0.1"]
  - ["X-Original-URL", "/admin"]
  - ["X-Rewrite-URL", "/admin"]
  - ["X-Custom-IP-Authorization", "127.0.0.1"]

# Cookies para bypass de autenticacao (par nome/valor)
auth_cookies:
  - ["session", ""]
  - ["session", "null"]
  - ["token", ""]
  - ["auth", ""]
  - ["sid", ""]

# Content-Type alternativos para switch de parser
content_type_switch:
  - "application/xml"
  - "text/xml"
  - "application/x-www-form-urlencoded"
  - "multipart/form-data"
  - "text/plain"
  - "application/json"
  - "application/vnd.api+json"
  - "application/hal+json"
  - "application/ld+json"

# Charsets para fuzzing de encoding
content_type_charset:
  - "application/json; charset=UTF-7"
  - "application/json; charset=UTF-16"
  - "application/json; charset=UTF-32"
  - "application/json; charset=ISO-8859-1"
  - "application/json; charset=Windows-1252"

# Valores para injecao em boundary de multipart/form-data
content_type_boundary:
  - "------WebKitFormBoundary"
  - "------=_Part_"
  - "boundary=----"
  - "\""
  - "'"
  - "\r\n\r\n"
  - "%0d%0a%0d%0a"

# Prefixos para enumeracao de versoes de API
version_prefixes:
  - ""
  - /api
  - /v
  - /api/v

# Versoes a testar na enumeracao
versions:
  - "1"
  - "2"
  - "3"
  - "4"
  - "5"
  - "0"
  - "1.0"
  - "2.0"
  - "beta"
  - "latest"
  - "stable"
  - "draft"

# Sufixos para enumeracao de versoes de API
version_suffixes:
  - ""
  - "/"
  - ".json"
  - ".xml"

# Cabecalhos/metodos de method override (HATEOAS)
hateoas_method_override:
  - "_method"
  - "X-HTTP-Method-Override"
  - "X-HTTP-Method"
  - "X-Method-Override"

# Parametros de format para manipulacao de resposta
hateoas_format_params:
  - "_format"
  - "format"
  - "output"
  - "response_format"

# Verbos HTTP para teste de manipulacao REST
hateoas_rest_verbs:
  - "PUT"
  - "PATCH"
  - "DELETE"
  - "OPTIONS"
  - "HEAD"
  - "TRACE"
  - "CONNECT"
